name: Release - PromptPort Extension Package

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build-and-attach-release:
    name: Build & Attach Minimal Extension ZIP
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Minimal Runtime Extension
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          mkdir -p release
          zip -r "release/promptport-v${VERSION}.zip" manifest.json background.js content.js side_panel.html side_panel.css side_panel.js icons/
          cp "release/promptport-v${VERSION}.zip" release/promptport-latest.zip
          ls -la release/

      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/promptport-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
